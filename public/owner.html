<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Модерация записей · EchoMap</title>
    <link rel="stylesheet" href="owner.css" />
  </head>
  <body style="--accent: #38685d">
    <main>
      <header>
        <div>
          <span>EchoMap / Кабинет владельца</span>
          <h1>Модерация записей</h1>
        </div>
        <a href="./">На сайт</a>
      </header>
      <section>
        <form id="login">
          <label for="owner-key">Ключ владельца</label>
          <div class="row">
            <input
              id="owner-key"
              type="password"
              required
              minlength="32"
              maxlength="256"
              autocomplete="off"
            /><button>Войти</button>
          </div>
          <p class="muted">
            Ключ хранится только в памяти этой вкладки до выхода или обновления
            страницы.
          </p>
        </form>
        <div class="actions">
          <button id="logout" class="secondary" hidden>Выйти</button
          ><button id="refresh" class="secondary">Обновить</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <div id="workspace" hidden>
        <section>
          <h2>Записи авторов</h2>
          <p>
            Прослушайте запись и проверьте её описание перед публикацией. До
            одобрения аудио доступно только модератору.
          </p>
          <div id="uploads"></div>
        </section>
      </div>
    </main>
    <script src="owner.js" defer></script>
  </body>
</html>
